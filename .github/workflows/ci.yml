name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-worker.txt
          python -m pip install -e packages/fre_core
      - name: Run tests
        run: |
          PYTHONPATH=packages/fre_core/src:. pytest -q
      - name: Run offline demo
        env:
          DEMO_SKIP_LEAN: "1"
        run: |
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli demo --offline --example all
      - name: Validate examples
        run: |
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli validate-example-dir examples/finite_tree
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli validate-example-dir examples/category_theory_pullback
      - name: Export public artifacts
        run: |
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli export-public-benchmark
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli export-public-atlas
      - name: Licensing leak test
        run: |
          PYTHONPATH=packages/fre_core/src:. pytest tests/test_public_export.py -q -k "licensing or metadata_only"
      - name: Verify committed release manifest
        run: |
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli verify-release-manifest
          PYTHONPATH=packages/fre_core/src:. pytest tests/test_release_manifest.py -q -k committed_v020

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build documentation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
          python -m mkdocs build -f apps/docs-site/mkdocs.yml

