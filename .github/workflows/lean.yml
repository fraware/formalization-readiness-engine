name: lean

on:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | bash -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e packages/fre_core

      - name: Resolve and build Lean project
        working-directory: lean
        run: |
          lake update
          lake exe cache get
          lake build

      - name: Check rendered finite-tree LeanTask
        env:
          PYTHONPATH: packages/fre_core/src
        run: |
          python -m fre_core.cli check-lean \
            lean/FRETasks/Generated/FiniteTree.lean \
            --project-dir lean \
            --timeout-seconds 300

      - name: Check rendered category-theory LeanTask
        env:
          PYTHONPATH: packages/fre_core/src
        run: |
          python -m fre_core.cli check-lean \
            lean/FRETasks/Generated/CategoryTheoryPullback.lean \
            --project-dir lean \
            --timeout-seconds 300
