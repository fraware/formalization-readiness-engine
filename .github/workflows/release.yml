name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
      - name: Export public artifacts
        run: |
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli export-public-benchmark
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli export-public-atlas
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli generate-atlas-clusters
      - name: Copy exports into release bundle
        run: |
          mkdir -p "releases/${GITHUB_REF_NAME}/exports"
          cp public_exports/readinessbench.jsonl "releases/${GITHUB_REF_NAME}/exports/"
          cp public_exports/atlas.jsonl "releases/${GITHUB_REF_NAME}/exports/"
          cp public_exports/atlas_clusters.json "releases/${GITHUB_REF_NAME}/exports/"
      - name: Build release manifest
        run: |
          PYTHONPATH=packages/fre_core/src:. python -m fre_core.cli build-release-manifest \
            --release-version "${GITHUB_REF_NAME}" \
            --output-path "releases/${GITHUB_REF_NAME}/manifest.json" \
            --artifact-path "releases/${GITHUB_REF_NAME}/exports/readinessbench.jsonl" \
            --artifact-path "releases/${GITHUB_REF_NAME}/exports/atlas.jsonl" \
            --artifact-path "releases/${GITHUB_REF_NAME}/exports/atlas_clusters.json" \
            --repo-root .
      - name: Run release tests
        run: |
          PYTHONPATH=packages/fre_core/src:. pytest tests/test_release_manifest.py tests/test_atlas_generator.py -q
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/${{ github.ref_name }}/exports/readinessbench.jsonl
            releases/${{ github.ref_name }}/exports/atlas.jsonl
            releases/${{ github.ref_name }}/exports/atlas_clusters.json
            releases/${{ github.ref_name }}/manifest.json
